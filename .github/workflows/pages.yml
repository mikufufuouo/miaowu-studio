name: Publish studio website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get website files
        uses: actions/checkout@v7
      - name: Read GitHub Pages address
        id: pages
        uses: actions/configure-pages@v6
      - name: Prepare share links and search information
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/prepare_pages.py --base-url "$SITE_BASE_URL"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
